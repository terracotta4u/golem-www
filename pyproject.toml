[project]
name = "golem-www"
version = "0.1.0"
description = "Web tools for Golem: search, read, and interact with the internet"
readme = "README.md"
authors = [
    { name = "Nawaz Gafar" }
]
requires-python = ">=3.12"
dependencies = [
    "golem-agent-sdk>=0.1.3",
    "httpx>=0.28.1",
    "trafilatura>=2.2.0",
]

[tool.golem]
tools = "golem_www:tools"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
